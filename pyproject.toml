[build-system]
requires = [
  "scikit-build-core>=0.11",
  "cython>=3",
  "numpy>=2.0.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "cyvcf2"
dynamic = ["version"]
description = "fast vcf parsing with cython + htslib"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Brent Pedersen", email = "bpederse@gmail.com" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Programming Language :: Cython",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=2.0.0",
  "coloredlogs",
  "click",
]

[project.urls]
Homepage = "https://github.com/brentp/cyvcf2/"
Documentation = "https://brentp.github.io/cyvcf2/"

[project.scripts]
cyvcf2 = "cyvcf2.__main__:cli"

[tool.scikit-build]
wheel.packages = ["cyvcf2"]
wheel.exclude = [
  "cyvcf2/tests/**",
  "cyvcf2/*.c",
  "cyvcf2/*.h",
  "cyvcf2/*.pxd",
  "cyvcf2/*.pyx",
]
sdist.cmake = true
sdist.include = [
  "CMakeLists.txt",
  "htslib/htscodecs/htscodecs/version.h",
]
sdist.exclude = [
  "cyvcf2/tests/**",
  "htslib/test/**",
  "htslib/htscodecs/tests/**",
  "htslib/htscodecs/javascript/**",
  "htslib/config.status",
  "htslib/config.mk",
  "htslib/htscodecs.mk",
  "htslib/*.o",
  "htslib/**/*.o",
  "htslib/*.a",
  "htslib/*.so",
  "htslib/*.dylib",
  "htslib/*.dll",
]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "cyvcf2/_version.py"

[tool.pytest.ini_options]
testpaths = ["cyvcf2/tests"]
